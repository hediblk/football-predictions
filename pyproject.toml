[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictions"
version = "0.1.0"
description = "Probabilistic football standings forecasts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
  "jinja2>=3.1",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[project.scripts]
football-predict = "standing_prediction.predict_positions:main"
football-backtest = "standing_prediction.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["standing_prediction*"]
