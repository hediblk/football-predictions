[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-champions-league"
version = "0.1.0"
description = "Dated Champions League standings and knockout forecasts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["football-predictions>=0.1.0"]

[project.scripts]
football-ucl = "champions_league.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
