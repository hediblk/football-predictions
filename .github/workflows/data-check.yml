name: Published data checks

on:
  pull_request:
    paths:
      - "site/**"
      - "schemas/**"
      - "scripts/validate_site_data.py"
      - "scripts/build_site_data.py"
      - "scripts/build_squads.py"
      - "scripts/build_squad_usage.py"
      - "data/players/**"
      - "scripts/refresh_site.sh"
      - "src/standing_prediction/defaults.py"
      - "pyproject.toml"
      - "requirements-lock.txt"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "schemas/**"
      - "scripts/validate_site_data.py"
      - "scripts/build_site_data.py"
      - "scripts/build_squads.py"
      - "scripts/build_squad_usage.py"
      - "data/players/**"
      - "scripts/refresh_site.sh"
      - "src/standing_prediction/defaults.py"
      - "pyproject.toml"
      - "requirements-lock.txt"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -c requirements-lock.txt jsonschema rfc3339-validator rfc3986-validator
      - name: Validate the complete published dataset
        run: python scripts/validate_site_data.py --data site/data
