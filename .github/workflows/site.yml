name: Refresh and deploy site

on:
  schedule:
    # Daily at 05:30 UTC, after the previous evening's European matches.
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . -e packages/champions-league
      # Past-season downloads never change; current-season entries expire after an hour.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      - name: Run forecasts
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: scripts/refresh_site.sh
      - name: Commit refreshed data
        run: |
          git add site/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh site forecasts"
          git pull --rebase origin main
          git push origin HEAD:main

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here.
  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
