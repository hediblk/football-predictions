name: Refresh and deploy site

on:
  schedule:
    # Daily at 01:17 UTC (off the busy :00/:30 slots), after the previous evening's European matches.
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

concurrency:
  group: site
  cancel-in-progress: false

env:
  ENABLE_BACKTEST: ${{ vars.ENABLE_BACKTEST }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies and local packages
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -c requirements-lock.txt -e . -e packages/champions-league -e packages/forecast-calibration
      # Past-season downloads never change; current-season entries expire after an hour.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-
      # Never blocks the refresh; skipped until the ODDS_API_KEY secret is set.
      - name: Archive bookmaker odds
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/archive_odds.py --out data/odds
      - name: Archive Europa and Conference League results
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/archive_results.py --out data/results
      - name: Run forecasts
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: scripts/refresh_site.sh
      - name: Commit refreshed data
        run: |
          git add site/data data/odds data/results data/players/rosters data/players/baselines
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh site forecasts"
          fi
          git pull --rebase origin main
          # Rebase can introduce site/schema changes; validate the final candidate.
          python scripts/validate_site_data.py --data site/data
          git push origin HEAD:main

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here.
  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read  # checkout needs it on a private repo once permissions are listed
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Always the newest main: a push run queued behind a refresh must not redeploy older data.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -c requirements-lock.txt jsonschema rfc3339-validator rfc3986-validator playwright
      - name: Validate the exact site revision being deployed
        run: python scripts/validate_site_data.py --data site/data
      - name: Configure Backtest availability
        run: |
          backtest_enabled=false
          if [ "$ENABLE_BACKTEST" = 1 ]; then
            backtest_enabled=true
          fi
          printf 'export const BACKTEST_ENABLED = %s;\n' "$backtest_enabled" > site/assets/features.js
      # Versioned script and style URLs, so browsers never run cached code against the new files.
      - run: python scripts/stamp_assets.py site
      - name: Load every view of the build in headless Chromium
        run: |
          python -m playwright install --with-deps chromium
          python scripts/check_site.py --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
