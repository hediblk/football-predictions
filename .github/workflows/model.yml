name: Model checks

on:
  pull_request:
    paths:
      - "src/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "schemas/**"
      - "fixture_overrides.csv"
      - "pyproject.toml"
      - "requirements-lock.txt"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "schemas/**"
      - "fixture_overrides.csv"
      - "pyproject.toml"
      - "requirements-lock.txt"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies and local packages
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -c requirements-lock.txt -e '.[test]' -e packages/champions-league
      - name: Run offline model and exporter tests
        run: python -m pytest -q
