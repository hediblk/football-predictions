name: Site browser checks

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/build_squads.py"
      - "scripts/build_squad_usage.py"
      - "data/players/**"
      - "scripts/check_site.py"
      - "scripts/stamp_assets.py"
      - "requirements-lock.txt"
      - ".github/workflows/site-check.yml"
      - ".github/workflows/site.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -c requirements-lock.txt playwright
          python -m playwright install --with-deps chromium
      # Check the build the deploy publishes: asset URLs versioned, with the data in this revision.
      - run: python scripts/stamp_assets.py site
      - name: Load every view in headless Chromium
        run: python scripts/check_site.py --site site
